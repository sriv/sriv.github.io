<figure class="sketch">
<svg viewBox="0 0 720 330" role="img" aria-labelledby="gauge-chunked-title" stroke-linecap="round" stroke-linejoin="round">
<title id="gauge-chunked-title">Before: Gauge sends the report plugin one suite result message holding every spec, step and log, which grows with the suite until protobuf refuses it at 2 GB. After: Gauge sends a skeleton marked as chunked with the item count, followed by one message per item, each carrying its spec file name so the plugin can reassemble the result. Only plugins that declare the stream_result capability receive the chunked shape.</title>
