<title id="spot-timeline-title">Timeline of a spot interruption. On notice, the executor drains: stops taking tasks, finishes running ones and tells the queue it is terminating. Between thirty seconds and two minutes later, depending on the cloud, the machine is gone. Leftover work on a worker is retried as tasks elsewhere; if the coordinator was lost, the planner retries the query. A circuit breaker on the dead address makes critical calls fail fast and non-critical calls return nothing.</title>
