<title id="index-lifecycle-title">A query's scan builds a transient filter. If the task saw every row it commits the filter to the index store; if it failed, was cancelled or stopped at a LIMIT, the filter is thrown away. Later queries use the store to skip row groups. Indexes are persisted to object storage and loaded back in the background after a restart.</title>
